<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario con validacion en JS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="contenedor">
      <h2>Rregistrar producto</h2>

      <form id="formInventario">
        <div class="grupo-input">
          <label for="producto" n>Nombre Producto</label>
          <input
            type="text"
            id="Producto"
            placeholder="Ej: Teclado Mecánico "
          />
          <span class="mensaje-Error" id="error-producto"></span>
        </div>

        <div class="grupo-input">
          <label for="producto" n>Cantidad en stok</label>
          <input type="number" id="Cantidad" placeholder="Ej: 10" />
          <span class="mensaje-Error" id="error-cantidad"></span>
        </div>

        <div class="grupo-input">
          <label for="producto" n>Precio unitario ($)</label>
          <input type="number" id="Precio" placeholder="Ej: 10" />
          <span class="mensaje-Error" id="error-precio"></span>
        </div>

        <button type="submit">Guardar Producto</button>
        <p id="mensajeExito" class="mensaje-exito"></p>
      </form>
    </div>
    <script src="app.js"></script>
  </body>
</html>
