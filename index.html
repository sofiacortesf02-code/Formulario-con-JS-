<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulrio con validación en JS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="contenedor">
      <h2>Registrar Producto</h2>

      <form id="formInventario">
        <div class="grupo-input">
          <label for="producto">Nombre Producto</label>
          <input type="text" id="producto" placeholder="Ej: Teclado Mecánico" />
          <span class="mensaje-error" id="errorProducto"></span>
        </div>

        <div class="grupo-input">
          <label for="cantidad">Cantidad en stok:</label>
          <input type="number" id="cantidad" placeholder="Ej: 10" />
          <span class="mensaje-error" id="errorCantidad"></span>
        </div>

        <div class="grupo-input">
          <label for="precio">Precio unitario ($):</label>
          <input type="number" id="precio" placeholder="Ej: 10" />
          <span class="mensaje-error" id="errorPrecio"></span>
        </div>

        <button type="submit">Guardar Producto</button>
        <p id="mensajeExito" class="mensaje-exito"></p>
      </form>
    </div>

    <script src="app.js"></script>
  </body>
</html>
